# Optional global geometry setting for the comparison render.
fit = "letterbox"

[[variant]]
name = "default"
led_gamma = "bt709"
led_dark_floor = 0
led_shadow_red_bias = 0.5
rgb5_quantizer = true

[[variant]]
name = "no gamma"
led_gamma = 1
led_dark_floor = 0
led_shadow_red_bias = 0.5
rgb5_quantizer = true

[[variant]]
name = "no quantizer"
led_gamma = "bt709"
led_dark_floor = 0
led_shadow_red_bias = 0
rgb5_quantizer = false
